name: Test update with clear graph before

on:
  workflow_dispatch:

jobs:
  update-concepts:
    uses: ./.github/workflows/reusable_workflow.yml
    with:
      CLEAR_GRAPH: 'true'
      STARDOG_URL: 'https://stardog-test.cluster.ldbar.ch/lindas'
      LINDAS_QUERY_URL: 'https://test.lindas.admin.ch/query'
      BATCH_SIZE: '10'
    secrets:
      STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD_TEST }}