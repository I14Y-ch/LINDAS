name: "[DATASETS GRAPHDB TEST] Incremental Update"

on:
  schedule:
    - cron: "30 3 * * 1-5"
  workflow_dispatch:
    inputs:
      CLEAR_GRAPH:
        description: "Drop the target graph before upload"
        required: false
        type: boolean
        default: false
      CREATE_DATASET_CATALOG:
        description: "Create or update the optional common dataset catalogue"
        required: false
        type: boolean
        default: false

# Shares a lock with the destructive lifecycle check for this graph.
concurrency:
  group: graphdb-test-datasets
  cancel-in-progress: false
jobs:
  update-datasets:
    uses: ./.github/workflows/dataset_reusable_workflow.yml
    with:
      CLEAR_GRAPH: ${{ inputs.CLEAR_GRAPH || false }}
      CREATE_DATASET_CATALOG: ${{ inputs.CREATE_DATASET_CATALOG || false }}
      LINDAS_UPDATE_URL: "https://test.graphdb.lindas.admin.ch/repositories/lindas/statements"
      LINDAS_QUERY_URL: "https://test.lindas.admin.ch/query"
    secrets:
      STARDOG_PASSWORD: ${{ secrets.GRAPHDB_PASSWORD_INT }}
      STARDOG_USER: ${{ secrets.GRAPHDB_USER }}
