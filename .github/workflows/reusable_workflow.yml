name: Concept2Lindas Update (reusable workflow)

on:
  workflow_call:
    inputs:
      CLEAR_GRAPH:
        required: true
        type: boolean
      LINDAS_UPDATE_URL:
        required: true
        type: string
      LINDAS_QUERY_URL:
        required: true
        type: string
      BASE_API_URL:
        required: true
        type: string
      BATCH_SIZE:
        required: true
        type: string # strings in env; cast to int in code
        default: '10'
    
    secrets:
      STARDOG_PASSWORD:
        required: true
      STARDOG_USER:
        required: true

env:
  PYTHON_VERSION: '3.10'
  TARGET_GRAPH: 'https://lindas.admin.ch/fso/i14y'
  CLEAR_GRAPH: ${{ inputs.CLEAR_GRAPH }}
  LINDAS_UPDATE_URL: ${{ inputs.LINDAS_UPDATE_URL }}
  LINDAS_QUERY_URL: ${{ inputs.LINDAS_QUERY_URL }}
  BASE_API_URL: ${{ inputs.BASE_API_URL }}
  BATCH_SIZE: ${{ inputs.BATCH_SIZE }}

jobs:
  get-concepts:
    runs-on: ubuntu-latest
    outputs:
      concept_ids: ${{ steps.get-concepts.outputs.concept_ids }}
      total_concepts: ${{ steps.get-concepts.outputs.total_concepts }}
      batch_matrix: ${{ steps.get-concepts.outputs.batch_matrix }}
      output_file: ${{ steps.get-output-filename.outputs.filename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Get OUTPUT_FILE_NAME from Python config
        id: get-output-filename
        run: |
          OUTPUT_FILE=$(python -c "from concept2sharedDimension.src.versioning.config import OUTPUT_FILE_NAME; print(OUTPUT_FILE_NAME)")
          echo "filename=$OUTPUT_FILE" >> $GITHUB_OUTPUT
      - name: Get all concept IDs + build matrix
        id: get-concepts
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from concept2sharedDimension.src.versioning.utils import I14YAPIHelper
          from concept2sharedDimension.src.versioning.config import USE_STATUSES, STATUSES, CONCEPT_IDS
          if USE_STATUSES:
              print("Using status-based filtering")
              concepts = I14YAPIHelper.get_all_concepts(STATUSES)
              ids = [c['id'] for c in concepts]
              print(f"Total concepts found with statuses {STATUSES}: {len(ids)}")
          else:
              print("Using hardcoded concept IDs from config")
              ids = CONCEPT_IDS
              print(f"Total hardcoded concept IDs: {len(ids)}")
              print(f"Concept IDs: {ids[:3]}{'...' if len(ids) > 3 else ''}")
          batch_size = int(os.environ.get('BATCH_SIZE','30'))
          n_batches = (len(ids) + batch_size - 1) // batch_size
          print(f"Will create {n_batches} batches of size {batch_size}")
          
          # Run at least one empty batch so downstream jobs execute cleanly.
          matrix = {"include": [{"batch_index": i} for i in range(max(1, n_batches))]}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh:
            print(f"concept_ids={','.join(ids)}", file=gh)
            print(f"total_concepts={len(ids)}", file=gh)
            print(f"batch_matrix={json.dumps(matrix)}", file=gh)
          PY
      - name: Delete concepts on LINDAS that are not on I14Y
        if: env.CLEAR_GRAPH == 'false'
        id: delete-orhapned-concepts-lindas
        shell: bash
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        run: |
          python - <<'PY'
          from concept2sharedDimension.src.versioning.utils import delete_orphaned_concepts_lindas
          delete_orphaned_concepts_lindas()
          PY
  process-batches:
    needs: get-concepts
    if: ${{ needs.get-concepts.outputs.total_concepts != '0' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.get-concepts.outputs.batch_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Calculate batch range
        id: calc-batch
        shell: bash
        run: |
          CONCEPT_IDS='${{ needs.get-concepts.outputs.concept_ids }}'
          BATCH_SIZE=${{ env.BATCH_SIZE }}
          BATCH_INDEX=${{ matrix.batch_index }}
          # Convert comma-separated string to array
          IFS=',' read -ra ID_ARRAY <<< "$CONCEPT_IDS"
          TOTAL_IDS=${#ID_ARRAY[@]}
          echo "Total concept IDs: $TOTAL_IDS"
          echo "Batch size: $BATCH_SIZE" 
          echo "Batch index: $BATCH_INDEX"
          START=$((BATCH_INDEX * BATCH_SIZE))
          END=$((START + BATCH_SIZE))
          echo "Calculated range: $START to $END"
          # Handle case where END exceeds array size
          if [ $END -gt $TOTAL_IDS ]; then
            END=$TOTAL_IDS
          fi
          BATCH_IDS=""
          for ((i=START; i<END && i<TOTAL_IDS; i++)); do
            if [ -n "$BATCH_IDS" ]; then
              BATCH_IDS="$BATCH_IDS,${ID_ARRAY[i]}"
            else
              BATCH_IDS="${ID_ARRAY[i]}"
            fi
          done
          echo "Batch IDs for batch $BATCH_INDEX: $BATCH_IDS"
          echo "Processing concepts from index $START to $((END-1))"
          {
            echo "batch_ids=$BATCH_IDS"
            echo "batch_start=$START"
            echo "batch_end=$END"
            echo "actual_batch_size=$(echo "$BATCH_IDS" | tr ',' '\n' | wc -l)"
          } >> "$GITHUB_OUTPUT"
      - name: Process batch ${{ matrix.batch_index }} (${{ steps.calc-batch.outputs.batch_start }}-${{ steps.calc-batch.outputs.batch_end }})
        if: steps.calc-batch.outputs.batch_ids != ''
        env:
          BATCH_CONCEPT_IDS: ${{ steps.calc-batch.outputs.batch_ids }}
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        shell: bash
        run: |
          echo "Processing batch ${{ matrix.batch_index }}"
          echo "Concept IDs: $BATCH_CONCEPT_IDS"
          echo "Batch size: ${{ steps.calc-batch.outputs.actual_batch_size }}"
          
          # Run the main script with the environment variable set
          python -m concept2sharedDimension.src.main --batch-index ${{ matrix.batch_index }}
      - name: Validate RDF
        if: steps.calc-batch.outputs.batch_ids != ''
        env:
          OUTPUT_FILE: batch_${{ matrix.batch_index }}_${{ needs.get-concepts.outputs.output_file }}
        run: |
          echo "Validating RDF file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "File not found: $OUTPUT_FILE — skipping validation."
            exit 0
          fi
          rapper -i turtle -c "$OUTPUT_FILE"
      - name: Archive batch results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-${{ matrix.batch_index }}-output
          path: batch_${{ matrix.batch_index }}_${{ needs.get-concepts.outputs.output_file }}
          if-no-files-found: warn

  detect-ttl-output:
    needs: process-batches
    runs-on: ubuntu-latest
    outputs:
      has_ttl: ${{ steps.detect.outputs.has_ttl }}

    steps:
      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          path: batches
          pattern: batch-*-output
          merge-multiple: true

      - name: Detect if any TTL exists
        id: detect
        run: |
          count=$(find batches -name "*.ttl" | wc -l)
          echo "Found $count TTL files"
          if [ "$count" -gt 0 ]; then
            echo "has_ttl=true" >> $GITHUB_OUTPUT
          else
            echo "has_ttl=false" >> $GITHUB_OUTPUT
          fi

  clear-and-upload:
    needs: [get-concepts, process-batches, detect-ttl-output]
    if: ${{ needs.get-concepts.outputs.total_concepts != '0' && needs.detect-ttl-output.outputs.has_ttl == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
  
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          path: batches
          pattern: batch-*-output
          merge-multiple: true

      - name: List and validate batch files
        run: |
          echo "Downloaded batch files:"
          find batches -name "*.ttl" -type f | sort
          echo "File sizes:"
          find batches -name "*.ttl" -type f -exec ls -lh {} \;
          echo "Validating all batch files:"
          for file in batches/*.ttl; do
            if [ -f "$file" ]; then
              echo "-------------------------------------"
              echo "Validating $file"
              # Validation
              rapper -i turtle -c "$file"
            fi
          done
      - name: Clear LINDAS Graph
        if: env.CLEAR_GRAPH == 'true'
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        run: |
          python3 << 'EOF'
          from concept2sharedDimension.src.versioning.utils import LindasAPIHelper
          import os

          target_graph = os.environ['TARGET_GRAPH']

          print(f'Dropping graph: {target_graph}')

          LindasAPIHelper.graphdb_update(f"DROP GRAPH <{target_graph}>")

          print(f"Graph {target_graph} dropped successfully")

          EOF
      - name: Upload all batches to LINDAS
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
          LINDAS_UPDATE_URL: ${{ env.LINDAS_UPDATE_URL }}
          TARGET_GRAPH: ${{ env.TARGET_GRAPH }}
        run: |
          python3 << 'EOF'
          import os, glob
          from concept2sharedDimension.src.versioning.utils import LindasAPIHelper

          target_graph = os.environ['TARGET_GRAPH']

          batch_count = 0
          failed_uploads = 0

          for file_path in sorted(glob.glob("batches/*.ttl")):
              try:
                  LindasAPIHelper.graphdb_upload_ttl(file_path,target_graph)
                  batch_count += 1
                  print(f"SUCCESS: Uploaded {file_path}")
              except Exception as e:
                  failed_uploads += 1
                  print(f"FAILED: {file_path} - {e}")

          # Commit only if transaction itself is fine
          if failed_uploads == 0:
            print("All batches committed successfully")

          print("----------------------------------------")
          print(f"- Files queued for commit: {batch_count}")
          print(f"- Failed to queue: {failed_uploads}")

          if failed_uploads > 0:
              exit(1)
          EOF
  final-summary:
    needs: [get-concepts, process-batches, clear-and-upload]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Processing Summary:"
          echo "Total concepts: ${{ needs.get-concepts.outputs.total_concepts }}"
          echo "Batch size: ${{ env.BATCH_SIZE }}"
          echo "All batches have been processed and uploaded to LINDAS"
          echo "Target graph: ${{ env.TARGET_GRAPH }}"