name: Concept2Lindas Update (reusable workflow)

on:
  workflow_call:
    inputs:
      RUNNER:
        required: false
        type: string
        default: ubuntu-26.04
      CLEAR_GRAPH:
        required: true
        type: boolean
      LINDAS_UPDATE_URL:
        required: true
        type: string
      LINDAS_QUERY_URL:
        required: true
        type: string
      BASE_API_URL:
        required: true
        type: string
      STATUSES:
        required: true
        type: string
        default: "Qualified,Standard,PreferredStandard"

    secrets:
      STARDOG_PASSWORD:
        required: true
      STARDOG_USER:
        required: true

env:
  PYTHON_VERSION: "3.10"
  TARGET_GRAPH: "https://lindas.admin.ch/fso/i14y"
  CLEAR_GRAPH: ${{ inputs.CLEAR_GRAPH }}
  LINDAS_UPDATE_URL: ${{ inputs.LINDAS_UPDATE_URL }}
  LINDAS_QUERY_URL: ${{ inputs.LINDAS_QUERY_URL }}
  BASE_API_URL: ${{ inputs.BASE_API_URL }}
  STATUSES: ${{ inputs.STATUSES }}
  GRAPHDB_UPDATE_RETRIES: "3"
  GRAPHDB_UPDATE_BACKOFF_MIN: "0.5"
  GRAPHDB_UPDATE_BACKOFF_MAX: "1.5"

jobs:
  get-concepts:
    runs-on: ${{ inputs.RUNNER }}
    outputs:
      concept_ids: ${{ steps.get-concepts.outputs.concept_ids }}
      total_concepts: ${{ steps.get-concepts.outputs.total_concepts }}
      source_status_counts: ${{ steps.get-concepts.outputs.source_status_counts }}
      batch_matrix: ${{ steps.get-concepts.outputs.batch_matrix }}
      output_file: ${{ steps.get-output-filename.outputs.filename }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Prepare batches folder
        run: |
          rm -rf batches/*
          mkdir -p batches
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Get OUTPUT_FILE_NAME from Python config
        id: get-output-filename
        run: |
          OUTPUT_FILE=$(python -c "from concept2sharedDimension.src.versioning.config import OUTPUT_FILE_NAME; print(OUTPUT_FILE_NAME)")
          echo "filename=$OUTPUT_FILE" >> $GITHUB_OUTPUT
      - name: Get all concept IDs + build matrix
        id: get-concepts
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from concept2sharedDimension.src.versioning.utils import I14YAPIHelper
          from concept2sharedDimension.src.versioning.config import USE_STATUSES, STATUSES, CONCEPT_IDS
          print("Using status-based filtering")
          batches = I14YAPIHelper.get_concept_batches()
          concepts = I14YAPIHelper.get_all_concepts()
          source_status_counts = I14YAPIHelper.get_exported_concept_status_counts(STATUSES)
          ids = [c["id"] for c in concepts]
          print(f"Total concepts found with statuses {STATUSES}: {len(ids)}")
          print(f"Source concept versions by status: {source_status_counts}")

          manifest_path = "concept_source_manifest.json"
          I14YAPIHelper.write_export_manifest(manifest_path)
          print(f"Wrote frozen source manifest: {manifest_path}")

          n_batches = len(batches)
          print(f"Will create {n_batches} batches")

          # Build GitHub Actions matrix
          matrix = {"include": [{"batch_index": i, "concept_ids": ",".join(batch)} for i, batch in enumerate(batches)]}
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              print(f"concept_ids={','.join(ids)}", file=gh)
              print(f"total_concepts={len(ids)}", file=gh)
              source_status_counts_json = json.dumps(source_status_counts, sort_keys=True, separators=(",", ":"))
              print(f"source_status_counts={source_status_counts_json}", file=gh)
              print(f"batch_matrix={json.dumps(matrix)}", file=gh)
          PY
      - name: Archive frozen source manifest
        uses: actions/upload-artifact@v4
        with:
          name: concept-source-manifest-${{ github.run_id }}
          path: concept_source_manifest.json
          if-no-files-found: error
      - name: Delete concepts on LINDAS that are not on I14Y
        if: env.CLEAR_GRAPH == 'false'
        id: delete-orhapned-concepts-lindas
        shell: bash
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        run: |
          python - <<'PY'
          from concept2sharedDimension.src.versioning.utils import I14YAPIHelper, delete_orphaned_concepts_lindas
          I14YAPIHelper.load_export_manifest("concept_source_manifest.json")
          delete_orphaned_concepts_lindas()
          PY
  process-batches:
    needs: get-concepts
    if: ${{ needs.get-concepts.outputs.total_concepts != '0' }}
    runs-on: ${{ inputs.RUNNER }}
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix: ${{ fromJSON(needs.get-concepts.outputs.batch_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frozen source manifest
        uses: actions/download-artifact@v4
        with:
          name: concept-source-manifest-${{ github.run_id }}
          path: reconciliation

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Calculate batch range
        id: calc-batch
        shell: bash
        run: |
          BATCH_IDS="${{ matrix.concept_ids }}"
          echo "Batch IDs for batch ${{ matrix.batch_index }}: $BATCH_IDS"
          echo "Processing $(echo "$BATCH_IDS" | tr ',' '\n' | wc -l) concepts"
          {
            echo "batch_ids=$BATCH_IDS"
            echo "actual_batch_size=$(echo "$BATCH_IDS" | tr ',' '\n' | wc -l)"
          } >> "$GITHUB_OUTPUT"
      - name: Process batch ${{ matrix.batch_index }}
        if: steps.calc-batch.outputs.batch_ids != ''
        env:
          BATCH_CONCEPT_IDS: ${{ steps.calc-batch.outputs.batch_ids }}
          I14Y_CONCEPT_MANIFEST_PATH: reconciliation/concept_source_manifest.json
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        shell: bash
        run: |
          echo "Processing batch ${{ matrix.batch_index }}"
          echo "Concept IDs: $BATCH_CONCEPT_IDS"
          echo "Batch size: ${{ steps.calc-batch.outputs.actual_batch_size }}"

          # Run the main script with the environment variable set
          python -m concept2sharedDimension.src.main --batch-index ${{ matrix.batch_index }}
      - name: Validate RDF
        if: steps.calc-batch.outputs.batch_ids != ''
        env:
          OUTPUT_FILE: batch_${{ matrix.batch_index }}_${{ needs.get-concepts.outputs.output_file }}
        run: |
          echo "Validating RDF file: $OUTPUT_FILE"
          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "File not found: $OUTPUT_FILE — skipping validation."
            exit 0
          fi
          rapper -i turtle -c "$OUTPUT_FILE"
      - name: Sanitize statuses for filenames
        id: sanitize
        run: |
          SAFE_STATUSES="${{ env.STATUSES }}" 
          SAFE_STATUSES="${SAFE_STATUSES//,/ _}"
          SAFE_STATUSES="${SAFE_STATUSES// /_}"
          echo "safe_statuses=$SAFE_STATUSES" >> $GITHUB_OUTPUT
      - name: Archive batch results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch-${{ github.run_id }}-${{ steps.sanitize.outputs.safe_statuses }}-${{ matrix.batch_index }}-output
          path: batch_${{ matrix.batch_index }}_${{ needs.get-concepts.outputs.output_file }}
          if-no-files-found: warn

  detect-ttl-output:
    needs: process-batches
    runs-on: ${{ inputs.RUNNER }}
    outputs:
      has_ttl: ${{ steps.detect.outputs.has_ttl }}

    steps:
      - name: Sanitize statuses for filenames
        id: sanitize
        run: |
          SAFE_STATUSES="${{ env.STATUSES }}"
          SAFE_STATUSES="${SAFE_STATUSES//,/ _}"
          SAFE_STATUSES="${SAFE_STATUSES// /_}"
          echo "safe_statuses=$SAFE_STATUSES" >> $GITHUB_OUTPUT
      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          path: batches
          pattern: batch-${{ github.run_id }}-${{ steps.sanitize.outputs.safe_statuses }}-*
          merge-multiple: true

      - name: Detect if any TTL exists
        id: detect
        run: |
          count=$(find batches -name "*.ttl" | wc -l)
          echo "Found $count TTL files"
          if [ "$count" -gt 0 ]; then
            echo "has_ttl=true" >> $GITHUB_OUTPUT
          else
            echo "has_ttl=false" >> $GITHUB_OUTPUT
          fi

  clear-and-upload:
    needs: [get-concepts, process-batches, detect-ttl-output]
    if: ${{ needs.get-concepts.outputs.total_concepts != '0' && needs.detect-ttl-output.outputs.has_ttl == 'true' }}
    runs-on: ${{ inputs.RUNNER }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanitize statuses for filenames
        id: sanitize
        run: |
          SAFE_STATUSES="${{ env.STATUSES }}" 
          SAFE_STATUSES="${SAFE_STATUSES//,/ _}"
          SAFE_STATUSES="${SAFE_STATUSES// /_}"
          echo "safe_statuses=$SAFE_STATUSES" >> $GITHUB_OUTPUT
      - name: Download all batch artifacts
        uses: actions/download-artifact@v4
        with:
          path: batches
          pattern: batch-${{ github.run_id }}-${{ steps.sanitize.outputs.safe_statuses }}-*
          merge-multiple: true

      - name: List and validate batch files
        run: |
          echo "Downloaded batch files:"
          find batches -name "*.ttl" -type f | sort
          echo "File sizes:"
          find batches -name "*.ttl" -type f -exec ls -lh {} \;
          echo "Validating all batch files:"
          for file in batches/*.ttl; do
            if [ -f "$file" ]; then
              echo "-------------------------------------"
              echo "Validating $file"
              # Validation
              rapper -i turtle -c "$file"
            fi
          done
      - name: Clear LINDAS Graph
        if: env.CLEAR_GRAPH == 'true'
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        run: |
          python3 << 'EOF'
          from concept2sharedDimension.src.versioning.utils import LindasAPIHelper
          import os

          target_graph = os.environ['TARGET_GRAPH']

          print(f'Dropping graph: {target_graph}')

          LindasAPIHelper.graphdb_update(f"DROP SILENT GRAPH <{target_graph}>")

          print(f"Graph {target_graph} dropped successfully")

          EOF
      - name: Upload all batches to LINDAS
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
          LINDAS_UPDATE_URL: ${{ env.LINDAS_UPDATE_URL }}
          TARGET_GRAPH: ${{ env.TARGET_GRAPH }}
        run: |
          python3 << 'EOF'
          import os, glob
          from concept2sharedDimension.src.versioning.utils import LindasAPIHelper

          target_graph = os.environ['TARGET_GRAPH']

          batch_count = 0
          failed_uploads = 0

          for file_path in sorted(glob.glob("batches/*.ttl")):
              try:
                  LindasAPIHelper.graphdb_upload_ttl(file_path,target_graph)
                  batch_count += 1
              except Exception as e:
                  failed_uploads += 1
                  print(f"FAILED: {file_path} - {e}")

          # Commit only if transaction itself is fine
          if failed_uploads == 0:
            print("All batches committed successfully")

          print("----------------------------------------")
          print(f"- Files queued for commit: {batch_count}")
          print(f"- Failed to queue: {failed_uploads}")

          if failed_uploads > 0:
              exit(1)
          EOF
      - name: Clean up batches
        run: |
          rm -rf batches/*
          echo "All batch files removed after upload"
  verify-source-metrics:
    needs: [get-concepts, clear-and-upload]
    if: ${{ always() && needs.get-concepts.result == 'success' && (needs.clear-and-upload.result == 'success' || needs.clear-and-upload.result == 'skipped') }}
    runs-on: ${{ inputs.RUNNER }}
    env:
      STARDOG_USER: ${{ secrets.STARDOG_USER }}
      STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen source manifest
        uses: actions/download-artifact@v4
        with:
          name: concept-source-manifest-${{ github.run_id }}
          path: reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare imported concept versions by registration status
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          from concept2sharedDimension.src.versioning.config import TARGET_GRAPH
          from concept2sharedDimension.src.versioning.utils import I14YAPIHelper, LindasAPIHelper

          I14YAPIHelper.load_export_manifest("reconciliation/concept_source_manifest.json")
          source_counts = I14YAPIHelper.get_exported_concept_status_counts()
          if not source_counts:
              raise RuntimeError("No source concept status metrics were recorded")

          values = " ".join(json.dumps(status) for status in sorted(source_counts))
          query = f'''\
          PREFIX adms: <http://www.w3.org/ns/adms#>
          PREFIX schema: <http://schema.org/>
          PREFIX vl: <https://version.link/>
          SELECT ?status (COUNT(DISTINCT ?concept_version) AS ?count)
          WHERE {{
            GRAPH <{TARGET_GRAPH}> {{
              VALUES ?status {{ {values} }}
              ?concept_version a schema:DefinedTermSet, vl:Version ;
                               adms:status ?status .
            }}
          }}
          GROUP BY ?status
          ORDER BY ?status
          '''
          target_counts = {status: 0 for status in source_counts}
          for row in LindasAPIHelper.lindas_query(query):
              status = row["status"]["value"]
              target_counts[status] = int(row["count"]["value"])

          summary = [
              "## Concept source/LINDAS metrics",
              "",
              "| Registration status | i14y versions | LINDAS versions |",
              "| --- | ---: | ---: |",
          ]
          summary.extend(
              f"| {status} | {source_counts[status]} | {target_counts.get(status, 0)} |"
              for status in sorted(source_counts)
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")

          print(f"i14y concept versions by status: {source_counts}")
          print(f"LINDAS concept versions by status: {target_counts}")
          if target_counts != source_counts:
              raise RuntimeError("Concept source/LINDAS status metrics do not match")
          PY
  final-summary:
    needs: [get-concepts, process-batches, clear-and-upload, verify-source-metrics]
    runs-on: ${{ inputs.RUNNER }}
    if: always()
    steps:
      - name: Summary
        run: |
          echo "Processing Summary:"
          echo "Total concepts: ${{ needs.get-concepts.outputs.total_concepts }}"
          echo "Source concept versions by status: ${{ needs.get-concepts.outputs.source_status_counts }}"
          echo "All batches have been processed and uploaded to LINDAS"
          echo "Target graph: ${{ env.TARGET_GRAPH }}"
