name: "[TEST] Sequential update by statuses"

on:
  workflow_dispatch:

jobs:
  update-concepts:
    strategy:
      max-parallel: 1
      matrix:
        statuses:
          - "Qualified,Standard,PreferredStandard,Retired"
          - "Qualified,Standard,PreferredStandard,Retired,Candidate"
          - "Qualified,Standard,PreferredStandard,Retired,Candidate,Superseded"
          - "Qualified,Standard,PreferredStandard,Retired,Candidate,Superseded,Recorded"

    uses: ./.github/workflows/reusable_workflow.yml
    with:
      STATUSES: ${{ matrix.statuses }}
      CLEAR_GRAPH: false
      LINDAS_UPDATE_URL: "https://stardog-test.cluster.ldbar.ch/lindas"
      LINDAS_QUERY_URL: "https://test.lindas.admin.ch/query"
      BASE_API_URL: "https://api.i14y.admin.ch/api/public/v1/concepts/"
      BATCH_SIZE: "5"
    secrets:
      STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD_TEST }}
      STARDOG_USER: ${{ secrets.STARDOG_USER }}
