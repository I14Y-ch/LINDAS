name: "[GRAPHDB INT] update with clear graph before"

on:
  workflow_dispatch:

jobs:
  update-concepts:
    uses: ./.github/workflows/reusable_workflow.yml
    with:
      CLEAR_GRAPH: true
      LINDAS_UPDATE_URL: "https://int.graphdb.lindas.admin.ch/repositories/lindas/statements"
      LINDAS_QUERY_URL: "https://int.lindas.admin.ch/query"
      BASE_API_URL: "https://api.i14y.admin.ch/api/public/v1/concepts/"
      STATUSES: "Qualified,Standard,PreferredStandard,Retired,Candidate,Superseded,Recorded"
    secrets:
      STARDOG_PASSWORD: ${{ secrets.GRAPHDB_PASSWORD_INT }}
      STARDOG_USER: ${{ secrets.GRAPHDB_USER }}
