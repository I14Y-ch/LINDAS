name: "[GRAPHDB TEST] Incremental Update"

on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch:
    inputs:
      STATUSES:
        description: "Status list to import from i14y (comma separated string)"
        required: true
        default: "Qualified,Standard,PreferredStandard,Retired,Candidate,Superseded,Recorded"

# Shares a lock with the destructive lifecycle check for this graph.
concurrency:
  group: graphdb-test-concepts
  cancel-in-progress: false
jobs:
  update-concepts:
    uses: ./.github/workflows/reusable_workflow.yml
    with:
      CLEAR_GRAPH: false
      LINDAS_UPDATE_URL: "https://test.graphdb.lindas.admin.ch/repositories/lindas/statements"
      LINDAS_QUERY_URL: "https://test.lindas.admin.ch/query"
      BASE_API_URL: "https://api.i14y.admin.ch/api/public/v1/concepts/"
      STATUSES: ${{ inputs.STATUSES || 'Qualified,Standard,PreferredStandard,Retired,Candidate,Superseded,Recorded' }}
    secrets:
      STARDOG_PASSWORD: ${{ secrets.GRAPHDB_PASSWORD_INT }} # The credentials for GraphDB TEST are the same as for INT
      STARDOG_USER: ${{ secrets.GRAPHDB_USER }} # The credentials for GraphDB TEST are the same as for INT
