name: "[TEST] Incremental Update"

on:
  # TODO Sergiy: decomment once the workflows are approved
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      STATUSES:
        description: "Status list to import from i14y (comma separated string)"
        required: true
        default: "Qualified,Standard,PreferredStandard"

jobs:
  update-concepts:
    uses: ./.github/workflows/reusable_workflow.yml
    with:
      CLEAR_GRAPH: false
      LINDAS_UPDATE_URL: "https://stardog-test.cluster.ldbar.ch/lindas"
      LINDAS_QUERY_URL: "https://test.lindas.admin.ch/query"
      BASE_API_URL: "https://api.i14y.admin.ch/api/public/v1/concepts/"
      BATCH_SIZE: "10"
      STATUSES: ${{ inputs.STATUSES }}
    secrets:
      STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD_TEST }}
      STARDOG_USER: ${{ secrets.STARDOG_USER }}
