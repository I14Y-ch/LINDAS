name: Dataset2Lindas Update (reusable workflow)

on:
  workflow_call:
    inputs:
      RUNNER:
        required: false
        type: string
        default: ubuntu-26.04
      CLEAR_GRAPH:
        required: true
        type: boolean
      CREATE_DATASET_CATALOG:
        required: true
        type: boolean
      LINDAS_UPDATE_URL:
        required: true
        type: string
      LINDAS_QUERY_URL:
        required: true
        type: string
      I14Y_DATASETS_API_URL:
        required: false
        type: string
        default: https://api.i14y.admin.ch/api/datasets
      I14Y_DATASERVICES_API_URL:
        required: false
        type: string
        default: https://api.i14y.admin.ch/api/dataservices
    secrets:
      STARDOG_PASSWORD:
        required: true
      STARDOG_USER:
        required: true

env:
  PYTHON_VERSION: "3.10"
  TARGET_GRAPH: "https://lindas.admin.ch/fso/i14y"
  CLEAR_GRAPH: ${{ inputs.CLEAR_GRAPH }}
  CREATE_DATASET_CATALOG: ${{ inputs.CREATE_DATASET_CATALOG }}
  LINDAS_UPDATE_URL: ${{ inputs.LINDAS_UPDATE_URL }}
  LINDAS_QUERY_URL: ${{ inputs.LINDAS_QUERY_URL }}
  I14Y_DATASETS_API_URL: ${{ inputs.I14Y_DATASETS_API_URL }}
  I14Y_DATASERVICES_API_URL: ${{ inputs.I14Y_DATASERVICES_API_URL }}
  DATASET_BATCH_SIZE: "100"
  GRAPHDB_UPDATE_RETRIES: "3"
  GRAPHDB_UPDATE_BACKOFF_MIN: "0.5"
  GRAPHDB_UPDATE_BACKOFF_MAX: "1.5"

jobs:
  get-datasets:
    runs-on: ${{ inputs.RUNNER }}
    outputs:
      total_to_process: ${{ steps.plan.outputs.total_to_process }}
      source_count: ${{ steps.plan.outputs.source_count }}
      source_structure_count: ${{ steps.plan.outputs.source_structure_count }}
      batch_matrix: ${{ steps.plan.outputs.batch_matrix }}
      should_finalize: ${{ steps.plan.outputs.should_finalize }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan i14y and build the incremental plan
        id: plan
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from concurrent.futures import ThreadPoolExecutor
          from dataset2lindas.src.api import I14YDatasetsAPI, LindasDatasetsAPI
          from dataset2lindas.src.config import DatasetConfig
          from dataset2lindas.src.synchronizer import DatasetSourceManifest, DatasetSynchronizer

          config = DatasetConfig.from_env()
          i14y = I14YDatasetsAPI(config)
          with ThreadPoolExecutor(max_workers=2) as executor:
              structure_count_future = executor.submit(I14YDatasetsAPI(config).get_structured_dataset_count)
              source_datasets = i14y.get_all_datasets()
              source_structure_count = structure_count_future.result()
          plan = DatasetSynchronizer(config, i14y, LindasDatasetsAPI(config)).build_plan(source_datasets)
          if source_structure_count > len(plan.source_identifiers):
              raise RuntimeError(
                  "i14y reported more datasets with structures than total source datasets: "
                  f"{source_structure_count} > {len(plan.source_identifiers)}"
              )
          plan.write("dataset_sync_plan.json")
          DatasetSourceManifest(source_datasets, source_structure_count).write("dataset_source_manifest.json")
          batch_size = int(os.environ["DATASET_BATCH_SIZE"])
          batches = [plan.process_ids[index:index + batch_size] for index in range(0, len(plan.process_ids), batch_size)]
          matrix = {"include": [
              {"batch_index": index, "dataset_ids": ",".join(batch)}
              for index, batch in enumerate(batches)
          ]}
          should_finalize = plan.has_work or config.clear_graph or config.create_dataset_catalog
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"total_to_process={len(plan.process_ids)}", file=output)
              print(f"source_count={len(plan.source_identifiers)}", file=output)
              print(f"source_structure_count={source_structure_count}", file=output)
              print(f"batch_matrix={json.dumps(matrix)}", file=output)
              print(f"should_finalize={'true' if should_finalize else 'false'}", file=output)
          print(f"Source datasets: {len(plan.source_identifiers)}")
          print(f"Source datasets with structures: {source_structure_count}")
          print(f"Datasets to write: {len(plan.process_ids)}")
          print(f"Datasets to delete: {len(plan.delete_identifiers)}")
          PY
      - name: Archive synchronization plan
        uses: actions/upload-artifact@v4
        with:
          name: dataset-sync-plan-${{ github.run_id }}
          path: dataset_sync_plan.json
      - name: Archive frozen dataset source manifest
        uses: actions/upload-artifact@v4
        with:
          name: dataset-source-manifest-${{ github.run_id }}
          path: dataset_source_manifest.json
          if-no-files-found: error

  process-batches:
    needs: get-datasets
    if: ${{ needs.get-datasets.outputs.total_to_process != '0' }}
    runs-on: ${{ inputs.RUNNER }}
    strategy:
      fail-fast: true
      max-parallel: 5
      matrix: ${{ fromJSON(needs.get-datasets.outputs.batch_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen dataset source manifest
        uses: actions/download-artifact@v4
        with:
          name: dataset-source-manifest-${{ github.run_id }}
          path: reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install -r requirements.txt
      - name: Export dataset batch ${{ matrix.batch_index }}
        env:
          BATCH_DATASET_IDS: ${{ matrix.dataset_ids }}
          I14Y_DATASET_MANIFEST_PATH: reconciliation/dataset_source_manifest.json
        run: python -m dataset2lindas.src.main --batch-index ${{ matrix.batch_index }}
      - name: Validate Turtle
        shell: bash
        run: |
          ttl_file="batch_${{ matrix.batch_index }}_datasets.ttl"
          set +e
          validation_output="$(rapper -i turtle -c "$ttl_file" 2>&1)"
          validation_status=$?
          set -e
          printf '%s\n' "$validation_output"
          if [ "$validation_status" -ne 0 ]; then
            error_line="$(printf '%s\n' "$validation_output" | sed -nE 's/.*\.ttl:([0-9]+).*/\1/p' | head -n 1)"
            if [ -n "$error_line" ]; then
              first_line=$((error_line > 5 ? error_line - 5 : 1))
              last_line=$((error_line + 5))
              echo "::group::Turtle context around line $error_line"
              nl -ba "$ttl_file" | sed -n "${first_line},${last_line}p"
              echo "::endgroup::"
            fi
            exit "$validation_status"
          fi
      - name: Archive dataset batch
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dataset-batch-${{ github.run_id }}-${{ matrix.batch_index }}
          path: batch_${{ matrix.batch_index }}_datasets.ttl

  reconcile-and-upload:
    needs: [get-datasets, process-batches]
    if: ${{ always() && needs.get-datasets.result == 'success' && (needs.process-batches.result == 'success' || needs.process-batches.result == 'skipped') && needs.get-datasets.outputs.should_finalize == 'true' }}
    runs-on: ${{ inputs.RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install -r requirements.txt
      - name: Download synchronization plan
        uses: actions/download-artifact@v4
        with:
          name: dataset-sync-plan-${{ github.run_id }}
          path: reconciliation
      - name: Download frozen dataset source manifest
        uses: actions/download-artifact@v4
        with:
          name: dataset-source-manifest-${{ github.run_id }}
          path: reconciliation
      - name: Download validated dataset batches
        if: ${{ needs.get-datasets.outputs.total_to_process != '0' }}
        uses: actions/download-artifact@v4
        with:
          path: batches
          pattern: dataset-batch-${{ github.run_id }}-*
          merge-multiple: true
      - name: Validate all generated Turtle files
        if: ${{ needs.get-datasets.outputs.total_to_process != '0' }}
        run: |
          for file in batches/*.ttl; do
            test -f "$file" || continue
            rapper -i turtle -c "$file"
          done
      - name: Clear or reconcile the LINDAS graph
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        run: |
          python - <<'PY'
          from dataset2lindas.src.api import I14YDatasetsAPI, LindasDatasetsAPI
          from dataset2lindas.src.config import DatasetConfig
          from dataset2lindas.src.synchronizer import DatasetSynchronizer, SyncPlan

          config = DatasetConfig.from_env()
          lindas = LindasDatasetsAPI(config)
          if config.clear_graph:
              lindas.clear_graph()
          else:
              DatasetSynchronizer(config, I14YDatasetsAPI(config), lindas).apply_deletions(
                  SyncPlan.read("reconciliation/dataset_sync_plan.json")
              )
          PY
      - name: Build the optional common dataset catalogue
        if: env.CREATE_DATASET_CATALOG == 'true'
        env:
          I14Y_DATASET_MANIFEST_PATH: reconciliation/dataset_source_manifest.json
        run: |
          python -m dataset2lindas.src.main --catalog-only --output dataset_catalog.ttl
          rapper -i turtle -c dataset_catalog.ttl
      - name: Upload Turtle artifacts
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from dataset2lindas.src.api import LindasDatasetsAPI
          from dataset2lindas.src.config import DatasetConfig

          config = DatasetConfig.from_env()
          lindas = LindasDatasetsAPI(config)
          files = sorted(Path("batches").glob("*.ttl")) if Path("batches").exists() else []
          if Path("dataset_catalog.ttl").exists():
              files.append(Path("dataset_catalog.ttl"))
          for file_path in files:
              try:
                  lindas.upload_turtle(file_path)
              except Exception:
                  # GraphDB can reject an IRI although rapper accepted the Turtle.
                  # The batches are otherwise intentionally silent: print only the
                  # exact artifact which failed to upload.
                  print(f"::group::Turtle rejected by LINDAS: {file_path}")
                  print(file_path.read_text(encoding="utf-8"))
                  print("::endgroup::")
                  raise
          print(f"Uploaded {len(files)} Turtle artifact(s) to {config.target_graph}")
          PY
      - name: Remove orphaned publisher agents
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        run: |
          python - <<'PY'
          from dataset2lindas.src.api import LindasDatasetsAPI
          from dataset2lindas.src.config import DatasetConfig

          LindasDatasetsAPI(DatasetConfig.from_env()).delete_orphaned_publisher_agents()
          PY

  publish-portal-metadata:
    needs: [get-datasets, reconcile-and-upload]
    if: ${{ always() && needs.get-datasets.result == 'success' && (needs.reconcile-and-upload.result == 'success' || needs.reconcile-and-upload.result == 'skipped') }}
    runs-on: ${{ inputs.RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y raptor2-utils
          python -m pip install -r requirements.txt
      - name: Generate and validate portal dataset descriptions
        run: |
          python -m concept2sharedDimension.src.main \
            --publication-metadata-only \
            --output i14y_portal_metadata.ttl
          rapper -i turtle -c i14y_portal_metadata.ttl
      - name: Upload portal dataset descriptions
        env:
          STARDOG_USER: ${{ secrets.STARDOG_USER }}
          STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
        run: |
          python - <<'PY'
          from dataset2lindas.src.api import LindasDatasetsAPI
          from dataset2lindas.src.config import DatasetConfig

          config = DatasetConfig.from_env()
          lindas = LindasDatasetsAPI(config)
          description_uris = (
              "https://register.ld.admin.ch/.well-known/void/dataset/i14y",
              "https://register.ld.admin.ch/.well-known/void/dataset/i14y-concepts",
              "https://register.ld.admin.ch/.well-known/void/dataset/i14y-datasets",
          )
          for description_uri in description_uris:
              lindas.update(
                  f"DELETE WHERE {{ GRAPH <{config.target_graph}> {{ <{description_uri}> ?p ?o . }} }}"
              )
          lindas.upload_turtle("i14y_portal_metadata.ttl")
          PY
  verify-source-metrics:
    needs: [get-datasets, reconcile-and-upload, publish-portal-metadata]
    if: ${{ always() && needs.get-datasets.result == 'success' && needs.publish-portal-metadata.result == 'success' }}
    runs-on: ${{ inputs.RUNNER }}
    env:
      STARDOG_USER: ${{ secrets.STARDOG_USER }}
      STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen dataset source manifest
        uses: actions/download-artifact@v4
        with:
          name: dataset-source-manifest-${{ github.run_id }}
          path: reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare imported datasets and structures
        shell: bash
        run: |
          python - <<'PY'
          import os

          from dataset2lindas.src.api import LindasDatasetsAPI
          from dataset2lindas.src.config import DatasetConfig
          from dataset2lindas.src.synchronizer import DatasetSourceManifest

          config = DatasetConfig.from_env()
          source_manifest = DatasetSourceManifest.read("reconciliation/dataset_source_manifest.json")
          query = f'''\
          PREFIX dcat: <http://www.w3.org/ns/dcat#>
          PREFIX dct: <http://purl.org/dc/terms/>
          SELECT
            (COUNT(DISTINCT ?dataset) AS ?dataset_count)
            (COUNT(DISTINCT ?structured_dataset) AS ?structure_count)
          WHERE {{
            GRAPH <{config.target_graph}> {{
              ?dataset a dcat:Dataset ;
                       dct:identifier ?identifier .
              FILTER(
                isIRI(?dataset) &&
                STRSTARTS(STR(?dataset), "{config.dataset_uri_base}")
              )
              OPTIONAL {{
                ?dataset dct:conformsTo ?structure .
                FILTER(
                  isIRI(?structure) &&
                  STR(?structure) = CONCAT(STR(?dataset), "/structure")
                )
                BIND(?dataset AS ?structured_dataset)
              }}
            }}
          }}
          '''
          rows = LindasDatasetsAPI(config).query(query)
          if len(rows) != 1:
              raise RuntimeError(f"Expected one dataset metric row from LINDAS, got {len(rows)}")

          source_counts = {
              "datasets": len(source_manifest.source_identifiers),
              "structures": source_manifest.structured_dataset_count,
          }
          target_counts = {
              "datasets": int(rows[0]["dataset_count"]["value"]),
              "structures": int(rows[0]["structure_count"]["value"]),
          }
          summary = [
              "## Dataset source/LINDAS metrics",
              "",
              "| Metric | i14y | LINDAS |",
              "| --- | ---: | ---: |",
              f"| Datasets | {source_counts['datasets']} | {target_counts['datasets']} |",
              f"| Datasets with structure | {source_counts['structures']} | {target_counts['structures']} |",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(summary) + "\n")

          print(f"i14y dataset metrics: {source_counts}")
          print(f"LINDAS dataset metrics: {target_counts}")
          if target_counts != source_counts:
              raise RuntimeError("Dataset source/LINDAS metrics do not match")
          PY
  final-summary:
    needs: [get-datasets, process-batches, reconcile-and-upload, publish-portal-metadata, verify-source-metrics]
    if: always()
    runs-on: ${{ inputs.RUNNER }}
    steps:
      - name: Summary
        run: |
          echo "Source datasets: ${{ needs.get-datasets.outputs.source_count }}"
          echo "Source datasets with structures: ${{ needs.get-datasets.outputs.source_structure_count }}"
          echo "Datasets exported: ${{ needs.get-datasets.outputs.total_to_process }}"
          echo "Target graph: ${{ env.TARGET_GRAPH }}"
