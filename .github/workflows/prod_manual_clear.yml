name: "[PROD] update with clear graph before"

# TODO Sergiy: decomment once the workflows are approved
# on:
#   workflow_dispatch:

jobs:
  update-concepts:
    uses: ./.github/workflows/reusable_workflow.yml
    with:
      CLEAR_GRAPH: 'true'
      STARDOG_URL: 'https://stardog.cluster.ldbar.ch/lindas'
      LINDAS_QUERY_URL: 'https://lindas.admin.ch/query'
      BASE_API_URL: 'https://api.i14y.admin.ch/api/public/v1/concepts/'
      BATCH_SIZE: '10'
    secrets:
      STARDOG_PASSWORD: ${{ secrets.STARDOG_PASSWORD_PROD }}
      STARDOG_USER: ${{ secrets.STARDOG_USER }}